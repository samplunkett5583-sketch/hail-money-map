<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- roof surface -->
  <rect x="4" y="56" width="72" height="16" rx="3" fill="#c8a86a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- outer pipe (double-wall) -->
  <rect x="30" y="18" width="20" height="42" rx="4" fill="#b0b8c4" stroke="#374151" stroke-width="1.5"/>
  <!-- inner pipe (air gap) -->
  <rect x="34" y="21" width="12" height="35" rx="3" fill="#eef2f7" stroke="#94a3b8" stroke-width="1"/>
  <!-- Type-B dome cap -->
  <path d="M30 18 Q40 9 50 18 Z" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="40" cy="18" rx="10" ry="3.5" fill="#4b5563" stroke="#374151" stroke-width="1.5"/>
  <!-- double-wall collar ring -->
  <rect x="27" y="53" width="26" height="6" rx="3" fill="#94a3b8" stroke="#374151" stroke-width="1.5"/>
</svg>
