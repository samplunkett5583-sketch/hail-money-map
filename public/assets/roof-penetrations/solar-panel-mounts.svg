<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- roof surface -->
  <rect x="4" y="60" width="72" height="14" rx="3" fill="#c8a86a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- mounting rail top -->
  <rect x="12" y="32" width="56" height="5" rx="2" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- mounting rail bottom -->
  <rect x="12" y="52" width="56" height="5" rx="2" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- solar panel glass -->
  <rect x="16" y="20" width="48" height="36" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- panel grid lines -->
  <line x1="32" y1="20" x2="32" y2="56" stroke="#1e40af" stroke-width="1"/>
  <line x1="48" y1="20" x2="48" y2="56" stroke="#1e40af" stroke-width="1"/>
  <line x1="16" y1="33" x2="64" y2="33" stroke="#1e40af" stroke-width="1"/>
  <line x1="16" y1="44" x2="64" y2="44" stroke="#1e40af" stroke-width="1"/>
</svg>
