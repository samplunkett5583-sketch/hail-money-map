<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- left roof slope -->
  <polygon points="4,74 40,30 40,74" fill="#c8a86a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- right roof slope -->
  <polygon points="40,30 76,74 40,74" fill="#b8985a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- chimney body (brick) -->
  <rect x="26" y="8" width="28" height="42" rx="2" fill="#cd7c5c" stroke="#374151" stroke-width="1.5"/>
  <!-- brick coursing lines -->
  <line x1="26" y1="18" x2="54" y2="18" stroke="#b56848" stroke-width="1"/>
  <line x1="26" y1="27" x2="54" y2="27" stroke="#b56848" stroke-width="1"/>
  <line x1="26" y1="36" x2="54" y2="36" stroke="#b56848" stroke-width="1"/>
  <line x1="40" y1="8"  x2="40" y2="50" stroke="#b56848" stroke-width="1"/>
  <!-- step/counter flashing -->
  <path d="M26 48 L26 54 L40 42 L54 54 L54 48" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- chimney cap -->
  <rect x="22" y="5" width="36" height="5" rx="2" fill="#374151" stroke="#374151" stroke-width="1"/>
</svg>
