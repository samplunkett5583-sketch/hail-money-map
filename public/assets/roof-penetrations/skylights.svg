<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- roof surface -->
  <rect x="4" y="58" width="72" height="14" rx="3" fill="#c8a86a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- skylight curb/frame -->
  <rect x="12" y="38" width="56" height="24" rx="3" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
  <!-- glazing / glass panels -->
  <rect x="16" y="22" width="48" height="24" rx="3" fill="#bfdbfe" stroke="#374151" stroke-width="1.5"/>
  <!-- frame dividers -->
  <line x1="40" y1="22" x2="40" y2="46" stroke="#6b7280" stroke-width="2"/>
  <line x1="16" y1="34" x2="64" y2="34" stroke="#6b7280" stroke-width="2"/>
  <!-- glass sheen -->
  <line x1="18" y1="24" x2="28" y2="24" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
</svg>
