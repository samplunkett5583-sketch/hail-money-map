<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- left roof slope -->
  <polygon points="5,72 40,24 40,72" fill="#c8a86a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- right roof slope -->
  <polygon points="40,24 75,72 40,72" fill="#b8985a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- ridge vent body (runs to the right) -->
  <rect x="28" y="20" width="40" height="10" rx="2" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- end cap plate (termination) -->
  <rect x="24" y="17" width="6" height="16" rx="2" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
  <!-- cap clips -->
  <rect x="20" y="19" width="7" height="12" rx="2" fill="#4b5563" stroke="#374151" stroke-width="1.5"/>
</svg>
