<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- wall surface (vertical) -->
  <rect x="4" y="10" width="12" height="64" rx="2" fill="#c8a86a" stroke="#6b7280" stroke-width="1.5"/>
  <!-- outer pipe (horizontal direct vent) -->
  <rect x="16" y="32" width="46" height="16" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- inner pipe double-wall -->
  <rect x="18" y="35" width="40" height="10" rx="2" fill="#dde4ec" stroke="#6b7280" stroke-width="1"/>
  <!-- termination cap -->
  <rect x="62" y="28" width="10" height="24" rx="3" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
  <line x1="64" y1="33" x2="64" y2="49" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="68" y1="33" x2="68" y2="49" stroke="#9ca3af" stroke-width="1.5"/>
</svg>
