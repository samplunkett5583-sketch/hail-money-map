<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hail Money</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #111827;
      --muted: #5f6673;
      --border: #d6dbe3;
      --accent: #b88722;
      --accent-2: #caa85c;
      --input: #ffffff;
      --error: #d93025;
      --maps-panel-width: 320px;
      --maps-panel-max-width: min(var(--maps-panel-width), calc(100vw - 24px));
      --maps-topbar-h: 52px;
      --crm-shell-header-h: 118px;
      --crm-shell-rail-w: 125px;
      --crm-shell-back-col-w: 66px;
      --crm-shell-feed-w: 320px;
      --crm-shell-gap: 20px;
      --crm-shell-pad-x: 18px;
      --crm-shell-pad-y: 14px;
      --crm-control-h: 42px;
      --crm-control-radius: 10px;
      --crm-card-radius: 14px;
      --crm-title-size: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      width: 100%;
      margin: 0;
      box-sizing: border-box;
      position: relative;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    body:not(.app-page-active) .topbar {
      display: none;
    }

    /* Leads: match the Dashboard header's width/alignment. Dashboard's own
       header lives inside the sidebar+content row, so it only spans the
       125px-wide icon sidebar's remaining width (starts at x:125). This
       shared outer header instead spans the full viewport (starts at x:0)
       on every other page, so on just this page we offset/narrow it by the
       sidebar's width to match. Reverted at the 960px breakpoint where the
       sidebar itself stacks to full width.
       NOTE: Create New Lead was previously included here too, but that
       left a blank strip on the left instead of the header/sidebar area
       spanning edge-to-edge like Dashboard's actually does visually — its
       header stays full-width (below) and only the placeholder box marks
       the far-left slot. */
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 0 1 auto;
      position: relative;
      z-index: 20;
    }

    .global-header-back-btn {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .map-header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      z-index: 20;
      flex: 0 0 auto;
    }

    .map-header-brand:hover {
      opacity: 0.85;
    }

    .app-top-hail-logo {
      position: static;
      height: 56px;
      width: auto;
      max-width: min(240px, 44vw);
      object-fit: contain;
    }

    .map-header-title {
      font-size: 14px;
      font-weight: 700;
      color: #111;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    /* Maps header date picker: lives in the true global topbar (not the left
       panel), so it stays visible regardless of which Maps tab is active and
       never overlaps the company logo (left) or map controls (on the map
       itself). Only shown while the Maps page is active. */
    .maps-header-date-row {
      display: none;
      align-items: center;
      gap: 6px;
      flex: 0 1 auto;
      min-width: 0;
    }
    body.map-page-active .maps-header-date-row {
      display: flex;
    }
    .maps-header-date-row .maps-date-input {
      width: 134px;
      padding: 5px 8px;
      font-size: 12px;
    }
    .maps-header-date-row .maps-header-load-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .maps-header-date-row .maps-status-msg {
      margin-top: 0;
      min-height: 0;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }
    @media (max-width: 700px) {
      .maps-header-date-row .maps-date-input {
        width: 108px;
      }
      .maps-header-date-row .maps-status-msg {
        display: none;
      }
    }

    /* Shared centered Main Menu brand for all app pages after login. */
    .map-header-center-brand {
      display: none;
      align-items: center;
      gap: 2px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      text-align: center;
    }
    .map-header-center-brand img {
      height: 34px;
      width: auto;
      object-fit: contain;
    }
    .map-header-center-heading,
    .map-header-center-subtitle {
      font-size: 19.5px;
      font-weight: 700;
      color: #111;
      line-height: 1.05;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .pipeline-header-center {
      display: contents;
    }

    .global-header-back-btn.is-visible {
      display: inline-flex;
    }

    body.app-page-active .map-header-brand {
      display: none;
    }

    body.app-page-active .map-header-center-brand {
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      cursor: pointer;
    }

    body.app-page-active .map-header-title {
      display: none;
    }

    .topbar-right {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      margin-left: auto;
      position: relative;
      z-index: 30;
    }

    .topbar-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pipeline-header-actions {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pipeline-header-meta {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      min-width: 0;
    }

    .pipeline-header-title {
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      white-space: nowrap;
    }

    .pipeline-header-company {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 4px 0;
    }

    .pipeline-header-company-logo {
      display: block;
      height: 86px;
      width: auto;
      max-width: min(250px, 18vw);
      object-fit: contain;
      background: transparent;
    }

    .topbar-pill {
      padding: 8px 12px;
    }

    body.map-page-active .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      margin: 0;
      z-index: 30;
      clip-path: none;
      min-height: var(--maps-topbar-h);
      height: var(--maps-topbar-h);
      padding: 4px 14px;
    }

    body.map-page-active {
      --maps-topbar-h: var(--crm-shell-header-h);
    }

    body.map-page-active .app-top-hail-logo {
      height: 36px;
      max-width: min(160px, 36vw);
    }

    body.map-page-active .map-header-center-brand img {
      height: 22px;
    }

    body.map-page-active .map-header-center-brand span {
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    /* ── Shared CRM header: every non-Maps CRM page ── */
    body.crm-page-active .topbar {
      min-height: 118px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      padding: 10px 20px 6px;
    }

    body.crm-page-active .screen {
      padding-top: 0;
    }

    body.crm-page-active .topbar-left {
      grid-column: 1;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      min-width: 0;
      gap: 6px;
    }

    body.crm-page-active .map-header-brand {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      order: 1;
    }

    body.crm-page-active #global-header-back-btn {
      order: 2;
    }

    body.crm-page-active #crm-pipeline-header-company {
      display: none !important;
    }

    body.crm-page-active .map-header-title {
      display: block;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    body.crm-page-active .app-top-hail-logo {
      height: 96px;
      max-width: min(320px, 30vw);
    }

    body.crm-page-active .pipeline-header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      grid-column: 2;
      justify-self: center;
    }

    body.crm-page-active .map-header-center-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: static;
      left: auto;
      top: auto;
      transform: none;
      pointer-events: auto;
      cursor: pointer;
      text-align: center;
    }

    body.crm-page-active .map-header-center-brand img {
      display: block;
      height: 60px;
      width: auto;
      max-width: min(220px, 18vw);
      object-fit: contain;
    }

    body.crm-page-active .map-header-center-heading,
    body.crm-page-active .map-header-center-subtitle {
      font-size: 20px;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }

    body.crm-page-active .pipeline-header-meta {
      display: none !important;
    }

    body.crm-page-active .topbar-right {
      grid-column: 3;
      justify-self: end;
      margin-left: 0;
      align-items: center;
      justify-content: flex-end;
      flex-direction: row;
    }

    body.crm-page-active .topbar-right > :not(.topbar-controls) {
      display: none !important;
    }

    body.crm-page-active .crm-co-header {
      display: none;
    }

    .crm-header-page-title {
      display: none;
      min-width: 0;
      font-size: 26px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Shared CRM header company logo: same 68x68 uploaded company logo slot
       used across Dashboard chrome, shown only on the standard CRM header. */
    .crm-header-company-logo {
      display: none;
    }
    body.crm-standard-header-active .crm-header-company-logo {
      display: block;
      width: 68px;
      height: 68px;
      object-fit: contain;
      object-position: center;
      flex: 0 0 auto;
      pointer-events: none;
      user-select: none;
    }

    .crm-header-inline-title {
      display: none;
      min-width: 0;
      font-size: 26px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .crm-shared-header-hidden {
      display: none !important;
    }

    body.crm-standard-header-active .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      margin-bottom: 0;
    }

    body.crm-standard-header-active .screen {
      padding-top: 18px;
    }

    body.crm-standard-header-active .topbar-left {
      grid-column: 1;
      justify-self: start;
      position: relative;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: center;
      gap: 18px;
      min-width: 0;
      overflow: visible;
      margin-left: 0;
      padding-left: 0;
    }

    body.crm-standard-header-active .map-header-brand {
      order: 1;
      gap: 0;
      flex: 0 0 auto;
      justify-content: flex-start;
      margin-left: 0;
    }

    body.crm-standard-header-active .pipeline-header-center {
      grid-column: 2;
      justify-self: center;
    }

    body.crm-standard-header-active .topbar-right {
      grid-column: 3;
      justify-self: end;
      margin-left: 0;
    }

    body.crm-standard-header-active .map-header-title {
      display: none !important;
    }

    body.crm-standard-header-active .crm-header-page-title:not([hidden]) {
      display: block;
      order: 2;
      align-self: center;
    }

    body.crm-standard-header-active .crm-header-page-title[hidden] {
      display: none;
    }

    body.crm-standard-header-active .app-top-hail-logo {
      height: 86px;
      max-width: min(300px, 26vw);
    }

    body.crm-standard-header-active #global-header-back-btn {
      position: absolute;
      left: 0;
      top: calc(100% + 8px);
      order: initial;
      z-index: 35;
    }

    body.crm-standard-header-active #page-crm-calendar .crm-calendar-brand {
      display: flex !important;
    }

    .map-header-center-subtitle {
      display: none !important;
    }
    body.main-menu-page-active .map-header-center-subtitle {
      display: block !important;
    }
    body.crm-standard-header-active .map-header-brand {
      display: none;
    }

    @media (max-width: 700px) {
      body.map-page-active .topbar {
        left: 0;
        clip-path: none;
      }

      header.topbar {
        min-height: 78px;
        padding: 10px 12px 8px;
      }

      body.map-page-active header.topbar {
        min-height: var(--maps-topbar-h);
        height: var(--maps-topbar-h);
        padding: 4px 10px;
      }

      body.crm-page-active header.topbar {
        min-height: 102px;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        gap: 10px;
        padding: 6px 12px 4px;
      }

      body.crm-page-active .app-top-hail-logo {
        height: 60px;
        max-width: min(190px, 42vw);
      }

      body.crm-page-active .map-header-center-brand img {
        height: 42px;
        max-width: min(150px, 28vw);
      }

      body.crm-page-active .map-header-center-heading,
      body.crm-page-active .map-header-center-subtitle {
        font-size: 16px;
      }

      body.crm-page-active .map-header-title {
        font-size: 15px;
      }

      .crm-header-page-title {
        font-size: 18px;
      }

      .crm-header-inline-title {
        font-size: 18px;
      }

      body.crm-standard-header-active .screen {
        padding-top: 14px;
      }

      body.crm-standard-header-active .app-top-hail-logo {
        height: 62px;
        max-width: min(190px, 40vw);
      }

      body.crm-standard-header-active .topbar-left {
        gap: 12px;
      }

      body.crm-standard-header-active #global-header-back-btn {
        top: calc(100% + 6px);
      }

      .topbar-left {
        gap: 8px;
      }

      .global-header-back-btn {
        padding: 6px 10px;
        font-size: 11px;
      }

      .map-header-center-brand img {
        height: 28px;
      }

      .map-header-center-heading,
      .map-header-center-subtitle {
        font-size: 11px;
      }

      .topbar-controls {
        gap: 8px;
      }

      .map-header-brand {
        gap: 6px;
      }

      img.app-top-hail-logo {
        height: 40px;
        max-width: min(170px, 52vw);
      }

      .map-header-title {
        font-size: 12px;
      }
    }

    @media (max-width: 620px) {
      .crm-profile-dropdown {
        left: 0;
        right: 0;
        min-width: 0;
      }
    }

    .screen {
      flex: 1;
      width: 100%;
      padding: 28px 16px 40px;
    }

    body:not(.app-page-active) .screen {
      padding-top: 0;
    }

    /* Calendar's content needs to start below the fixed shared header
       while still sitting flush against the left/right viewport edges. */
    body.calendar-page-active .screen {
      padding: var(--crm-mini-shell-header-offset, 118px) 0 0 !important;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      display: none !important;
      width: 100%;
    }

    .page.active {
      display: block !important;
    }

    .main-menu-wrap,
    .new-lead-wrap,
    .placeholder-wrap,
    .assigned-leads-wrap,
    .job-detail-wrap {
      width: 100%;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }

    .main-menu-title,
    .page-title {
      margin: 0 0 6px;
      font-size: 34px;
      line-height: 1.1;
      font-weight: 700;
    }

    .page-subtitle {
      margin: 0 0 18px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 400;
    }

    .main-menu-card,
    .form-card,
    .placeholder-card,
    .job-detail-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .placeholder-card {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .menu-section + .menu-section,
    .form-section + .form-section,
    .job-detail-section + .job-detail-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .menu-section-header,
    .form-section-header,
    .job-detail-section-header {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-row {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      appearance: none;
    }

    .menu-row.menu-row-title-only {
      display: flex;
      align-items: center;
      min-height: 56px;
    }

    .menu-row-primary {
      border-color: var(--accent-2);
      box-shadow: inset 0 0 0 1px rgba(202, 168, 92, 0.18);
    }

    .menu-row-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .menu-row.menu-row-title-only .menu-row-title {
      margin-bottom: 0;
    }

    .menu-row-desc {
      font-size: 19.5px;
      line-height: 1.45;
      color: var(--muted);
    }

    .menu-row-disabled {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .menu-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .menu-row-badge {
      font-size: 16.5px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .menu-row-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--accent-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow {
      --menu-tone: #4f83ff;
      --menu-tone-deep: #315ed0;
      --menu-tone-soft: rgba(79, 131, 255, 0.16);
      --menu-tone-border: rgba(79, 131, 255, 0.28);
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 15px 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
        var(--panel-2);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow:hover {
      border-color: var(--menu-tone-border);
      box-shadow:
        0 14px 26px rgba(15, 23, 42, 0.16),
        inset 0 0 0 1px var(--menu-tone-soft);
      transform: translateY(-1px);
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow:focus-visible {
      outline: none;
      border-color: var(--menu-tone);
      box-shadow:
        0 0 0 3px var(--menu-tone-soft),
        inset 0 0 0 1px var(--menu-tone-soft);
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow.menu-row-primary {
      border-color: var(--menu-tone-border);
      box-shadow: inset 0 0 0 1px var(--menu-tone-soft);
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow.menu-row-disabled {
      opacity: 0.68;
      box-shadow: none;
      transform: none;
    }

    body.main-menu-page-active #page-main-menu .menu-row-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--menu-tone), var(--menu-tone-deep));
      color: #fff;
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
