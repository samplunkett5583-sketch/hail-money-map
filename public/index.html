<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hail Money</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #111827;
      --muted: #5f6673;
      --border: #d6dbe3;
      --accent: #b88722;
      --accent-2: #caa85c;
      --input: #ffffff;
      --error: #d93025;
      --maps-panel-width: 320px;
      --maps-panel-max-width: min(var(--maps-panel-width), calc(100vw - 24px));
      --maps-topbar-h: 52px;
      --crm-shell-header-h: 118px;
      --crm-shell-rail-w: 125px;
      --crm-shell-back-col-w: 66px;
      --crm-shell-feed-w: 320px;
      --crm-shell-gap: 20px;
      --crm-shell-pad-x: 18px;
      --crm-shell-pad-y: 14px;
      --crm-control-h: 42px;
      --crm-control-radius: 10px;
      --crm-card-radius: 14px;
      --crm-title-size: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      width: 100%;
      margin: 0;
      box-sizing: border-box;
      position: relative;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    body:not(.app-page-active) .topbar {
      display: none;
    }

    /* Leads: match the Dashboard header's width/alignment. Dashboard's own
       header lives inside the sidebar+content row, so it only spans the
       125px-wide icon sidebar's remaining width (starts at x:125). This
       shared outer header instead spans the full viewport (starts at x:0)
       on every other page, so on just this page we offset/narrow it by the
       sidebar's width to match. Reverted at the 960px breakpoint where the
       sidebar itself stacks to full width.
       NOTE: Create New Lead was previously included here too, but that
       left a blank strip on the left instead of the header/sidebar area
       spanning edge-to-edge like Dashboard's actually does visually â€” its
       header stays full-width (below) and only the placeholder box marks
       the far-left slot. */
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 0 1 auto;
      position: relative;
      z-index: 20;
    }

    .global-header-back-btn {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .map-header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      z-index: 20;
      flex: 0 0 auto;
    }

    .map-header-brand:hover {
      opacity: 0.85;
    }

    .app-top-hail-logo {
      position: static;
      height: 56px;
      width: auto;
      max-width: min(240px, 44vw);
      object-fit: contain;
    }

    .map-header-title {
      font-size: 14px;
      font-weight: 700;
      color: #111;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    /* Maps header date picker: lives in the true global topbar (not the left
       panel), so it stays visible regardless of which Maps tab is active and
       never overlaps the company logo (left) or map controls (on the map
       itself). Only shown while the Maps page is active. */
    .maps-header-date-row {
      display: none;
      align-items: center;
      gap: 6px;
      flex: 0 1 auto;
      min-width: 0;
    }
    body.map-page-active .maps-header-date-row {
      display: flex;
    }
    .maps-header-date-row .maps-date-input {
      width: 134px;
      padding: 5px 8px;
      font-size: 12px;
    }
    .maps-header-date-row .maps-header-load-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .maps-header-date-row .maps-status-msg {
      margin-top: 0;
      min-height: 0;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }
    @media (max-width: 700px) {
      .maps-header-date-row .maps-date-input {
        width: 108px;
      }
      .maps-header-date-row .maps-status-msg {
        display: none;
      }
    }

    /* Shared centered Main Menu brand for all app pages after login. */
    .map-header-center-brand {
      display: none;
      align-items: center;
      gap: 2px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      text-align: center;
    }
    .map-header-center-brand img {
      height: 34px;
      width: auto;
      object-fit: contain;
    }
    .map-header-center-heading,
    .map-header-center-subtitle {
      font-size: 19.5px;
      font-weight: 700;
      color: #111;
      line-height: 1.05;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .pipeline-header-center {
      display: contents;
    }

    .global-header-back-btn.is-visible {
      display: inline-flex;
    }

    body.app-page-active .map-header-brand {
      display: none;
    }

    body.app-page-active .map-header-center-brand {
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      cursor: pointer;
    }

    body.app-page-active .map-header-title {
      display: none;
    }

    .topbar-right {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      margin-left: auto;
      position: relative;
      z-index: 30;
    }

    .topbar-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pipeline-header-actions {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pipeline-header-meta {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      min-width: 0;
    }

    .pipeline-header-title {
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      white-space: nowrap;
    }

    .pipeline-header-company {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 4px 0;
    }

    .pipeline-header-company-logo {
      display: block;
      height: 86px;
      width: auto;
      max-width: min(250px, 18vw);
      object-fit: contain;
      background: transparent;
    }

    .topbar-pill {
      padding: 8px 12px;
    }

    body.map-page-active .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      margin: 0;
      z-index: 30;
      clip-path: none;
      min-height: var(--maps-topbar-h);
      height: var(--maps-topbar-h);
      padding: 4px 14px;
    }

    body.map-page-active {
      --maps-topbar-h: var(--crm-shell-header-h);
    }

    body.map-page-active .app-top-hail-logo {
      height: 36px;
      max-width: min(160px, 36vw);
    }

    body.map-page-active .map-header-center-brand img {
      height: 22px;
    }

    body.map-page-active .map-header-center-brand span {
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    /* â”€â”€ Shared CRM header: every non-Maps CRM page â”€â”€ */
    body.crm-page-active .topbar {
      min-height: 118px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      padding: 10px 20px 6px;
    }

    body.crm-page-active .screen {
      padding-top: 0;
    }

    body.crm-page-active .topbar-left {
      grid-column: 1;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      min-width: 0;
      gap: 6px;
    }

    body.crm-page-active .map-header-brand {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      order: 1;
    }

    body.crm-page-active #global-header-back-btn {
      order: 2;
    }

    body.crm-page-active #crm-pipeline-header-company {
      display: none !important;
    }

    body.crm-page-active .map-header-title {
      display: block;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    body.crm-page-active .app-top-hail-logo {
      height: 96px;
      max-width: min(320px, 30vw);
    }

    body.crm-page-active .pipeline-header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      grid-column: 2;
      justify-self: center;
    }

    body.crm-page-active .map-header-center-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: static;
      left: auto;
      top: auto;
      transform: none;
      pointer-events: auto;
      cursor: pointer;
      text-align: center;
    }

    body.crm-page-active .map-header-center-brand img {
      display: block;
      height: 60px;
      width: auto;
      max-width: min(220px, 18vw);
      object-fit: contain;
    }

    body.crm-page-active .map-header-center-heading,
    body.crm-page-active .map-header-center-subtitle {
      font-size: 20px;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }

    body.crm-page-active .pipeline-header-meta {
      display: none !important;
    }

    body.crm-page-active .topbar-right {
      grid-column: 3;
      justify-self: end;
      margin-left: 0;
      align-items: center;
      justify-content: flex-end;
      flex-direction: row;
    }

    body.crm-page-active .topbar-right > :not(.topbar-controls) {
      display: none !important;
    }

    body.crm-page-active .crm-co-header {
      display: none;
    }

    .crm-header-page-title {
      display: none;
      min-width: 0;
      font-size: 26px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Shared CRM header company logo: same 68x68 uploaded company logo slot
       used across Dashboard chrome, shown only on the standard CRM header. */
    .crm-header-company-logo {
      display: none;
    }
    body.crm-standard-header-active .crm-header-company-logo {
      display: block;
      width: 68px;
      height: 68px;
      object-fit: contain;
      object-position: center;
      flex: 0 0 auto;
      pointer-events: none;
      user-select: none;
    }

    .crm-header-inline-title {
      display: none;
      min-width: 0;
      font-size: 26px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .crm-shared-header-hidden {
      display: none !important;
    }

    body.crm-standard-header-active .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      margin-bottom: 0;
    }

    body.crm-standard-header-active .screen {
      padding-top: 18px;
    }

    body.crm-standard-header-active .topbar-left {
      grid-column: 1;
      justify-self: start;
      position: relative;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: center;
      gap: 18px;
      min-width: 0;
      overflow: visible;
      margin-left: 0;
      padding-left: 0;
    }

    body.crm-standard-header-active .map-header-brand {
      order: 1;
      gap: 0;
      flex: 0 0 auto;
      justify-content: flex-start;
      margin-left: 0;
    }

    body.crm-standard-header-active .pipeline-header-center {
      grid-column: 2;
      justify-self: center;
    }

    body.crm-standard-header-active .topbar-right {
      grid-column: 3;
      justify-self: end;
      margin-left: 0;
    }

    body.crm-standard-header-active .map-header-title {
      display: none !important;
    }

    body.crm-standard-header-active .crm-header-page-title:not([hidden]) {
      display: block;
      order: 2;
      align-self: center;
    }

    body.crm-standard-header-active .crm-header-page-title[hidden] {
      display: none;
    }

    body.crm-standard-header-active .app-top-hail-logo {
      height: 86px;
      max-width: min(300px, 26vw);
    }

    body.crm-standard-header-active #global-header-back-btn {
      position: absolute;
      left: 0;
      top: calc(100% + 8px);
      order: initial;
      z-index: 35;
    }

    body.crm-standard-header-active #page-crm-calendar .crm-calendar-brand {
      display: flex !important;
    }

    .map-header-center-subtitle {
      display: none !important;
    }
    body.main-menu-page-active .map-header-center-subtitle {
      display: block !important;
    }
    body.crm-standard-header-active .map-header-brand {
      display: none;
    }

    @media (max-width: 700px) {
      body.map-page-active .topbar {
        left: 0;
        clip-path: none;
      }

      header.topbar {
        min-height: 78px;
        padding: 10px 12px 8px;
      }

      body.map-page-active header.topbar {
        min-height: var(--maps-topbar-h);
        height: var(--maps-topbar-h);
        padding: 4px 10px;
      }

      body.crm-page-active header.topbar {
        min-height: 102px;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        gap: 10px;
        padding: 6px 12px 4px;
      }

      body.crm-page-active .app-top-hail-logo {
        height: 60px;
        max-width: min(190px, 42vw);
      }

      body.crm-page-active .map-header-center-brand img {
        height: 42px;
        max-width: min(150px, 28vw);
      }

      body.crm-page-active .map-header-center-heading,
      body.crm-page-active .map-header-center-subtitle {
        font-size: 16px;
      }

      body.crm-page-active .map-header-title {
        font-size: 15px;
      }

      .crm-header-page-title {
        font-size: 18px;
      }

      .crm-header-inline-title {
        font-size: 18px;
      }

      body.crm-standard-header-active .screen {
        padding-top: 14px;
      }

      body.crm-standard-header-active .app-top-hail-logo {
        height: 62px;
        max-width: min(190px, 40vw);
      }

      body.crm-standard-header-active .topbar-left {
        gap: 12px;
      }

      body.crm-standard-header-active #global-header-back-btn {
        top: calc(100% + 6px);
      }

      .topbar-left {
        gap: 8px;
      }

      .global-header-back-btn {
        padding: 6px 10px;
        font-size: 11px;
      }

      .map-header-center-brand img {
        height: 28px;
      }

      .map-header-center-heading,
      .map-header-center-subtitle {
        font-size: 11px;
      }

      .topbar-controls {
        gap: 8px;
      }

      .map-header-brand {
        gap: 6px;
      }

      img.app-top-hail-logo {
        height: 40px;
        max-width: min(170px, 52vw);
      }

      .map-header-title {
        font-size: 12px;
      }
    }

    @media (max-width: 620px) {
      .crm-profile-dropdown {
        left: 0;
        right: 0;
        min-width: 0;
      }
    }

    .screen {
      flex: 1;
      width: 100%;
      padding: 28px 16px 40px;
    }

    body:not(.app-page-active) .screen {
      padding-top: 0;
    }

    /* Calendar's content needs to start below the fixed shared header
       while still sitting flush against the left/right viewport edges. */
    body.calendar-page-active .screen {
      padding: var(--crm-mini-shell-header-offset, 118px) 0 0 !important;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      display: none !important;
      width: 100%;
    }

    .page.active {
      display: block !important;
    }

    .main-menu-wrap,
    .new-lead-wrap,
    .placeholder-wrap,
    .assigned-leads-wrap,
    .job-detail-wrap {
      width: 100%;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }

    .main-menu-title,
    .page-title {
      margin: 0 0 6px;
      font-size: 34px;
      line-height: 1.1;
      font-weight: 700;
    }

    .page-subtitle {
      margin: 0 0 18px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 400;
    }

    .main-menu-card,
    .form-card,
    .placeholder-card,
    .job-detail-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .placeholder-card {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .menu-section + .menu-section,
    .form-section + .form-section,
    .job-detail-section + .job-detail-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .menu-section-header,
    .form-section-header,
    .job-detail-section-header {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-row {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      appearance: none;
    }

    .menu-row.menu-row-title-only {
      display: flex;
      align-items: center;
      min-height: 56px;
    }

    .menu-row-primary {
      border-color: var(--accent-2);
      box-shadow: inset 0 0 0 1px rgba(202, 168, 92, 0.18);
    }

    .menu-row-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .menu-row.menu-row-title-only .menu-row-title {
      margin-bottom: 0;
    }

    .menu-row-desc {
      font-size: 19.5px;
      line-height: 1.45;
      color: var(--muted);
    }

    .menu-row-disabled {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .menu-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .menu-row-badge {
      font-size: 16.5px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .menu-row-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--accent-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow {
      --menu-tone: #4f83ff;
      --menu-tone-deep: #315ed0;
      --menu-tone-soft: rgba(79, 131, 255, 0.16);
      --menu-tone-border: rgba(79, 131, 255, 0.28);
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 15px 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
        var(--panel-2);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow:hover {
      border-color: var(--menu-tone-border);
      box-shadow:
        0 14px 26px rgba(15, 23, 42, 0.16),
        inset 0 0 0 1px var(--menu-tone-soft);
      transform: translateY(-1px);
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow:focus-visible {
      outline: none;
      border-color: var(--menu-tone);
      box-shadow:
        0 0 0 3px var(--menu-tone-soft),
        inset 0 0 0 1px var(--menu-tone-soft);
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow.menu-row-primary {
      border-color: var(--menu-tone-border);
      box-shadow: inset 0 0 0 1px var(--menu-tone-soft);
    }

    body.main-menu-page-active #page-main-menu .menu-row-workflow.menu-row-disabled {
      opacity: 0.68;
      box-shadow: none;
      transform: none;
    }

    body.main-menu-page-active #page-main-menu .menu-row-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--menu-tone), var(--menu-tone-deep));
      color: #fff;
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.08em;

    /* Layered layout â€” the panel itself is just a positioning/collapse
       container with no background of its own; the header and each card
       below are their own separate floating boxes (see .maps-panel-sticky-top
       and .maps-storm-row / .maps-impact-state-card), so the map shows
       through the gaps instead of one big solid panel. */
    .maps-panel {
      position: fixed;
      top: calc(var(--maps-topbar-h) + 12px);
      left: 12px;
      bottom: 48px;
      width: var(--maps-panel-max-width);
      min-width: 260px;
      max-width: var(--maps-panel-max-width);
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      display:flex; flex-direction:column; gap:12px;
      overflow: hidden; padding:0 2px 0 0;
      margin-top: 0;
      z-index:100;
      pointer-events:auto;
      transition: transform 0.24s ease;
    }
    .maps-panel.is-collapsed {
      transform: translateX(calc(-100% - 24px));
    }
    /* Anchored top box: title/subtitle + "Most Recent Storms" + tabs. Fixed
       in the flex column (not scrolling) so the card list below it scrolls
       on its own and visually disappears underneath this box. */
    .maps-panel-sticky-top {
      flex: 0 0 auto;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(214,219,227,0.96);
      border-radius: 18px;
      box-shadow: 0 18px 36px rgba(15,23,42,0.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
      position: relative;
      z-index: 3;
    }
    .maps-panel-sticky-top::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.84) 48%, rgba(255,255,255,1) 100%);
      pointer-events: none;
    }
    .maps-panel-section-tabs {
      padding-top: 0;
      border-bottom: none;
    }
    /* Scrollable card list â€” the ONLY part of the panel that scrolls. Sits
       below the anchored header in normal flex flow, so the page behind it
       never moves and cards are naturally clipped at the header's edge. */
    .maps-panel-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      margin-top: -22px;
      padding: 28px 4px 8px;
      position: relative;
      z-index: 1;
      scrollbar-gutter: stable;
    }
    .maps-panel-collapse-tab {
      position: fixed;
      top: calc(var(--maps-topbar-h) + 24px);
      left: calc(12px + var(--maps-panel-max-width) - 6px);
      width: 34px;
      height: 56px;
      border: 1px solid rgba(214,219,227,0.96);
      border-left: none;
      border-radius: 0 14px 14px 0;
      background: rgba(255,255,255,0.96);
      color: var(--text);
      font-size: 24px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 101;
      box-shadow: 0 12px 28px rgba(15,23,42,0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: left 0.24s ease, background 0.15s ease, box-shadow 0.24s ease;
      pointer-events: auto;
    }
    .maps-panel-collapse-tab:hover {
      background: var(--panel);
    }
    .maps-panel.is-collapsed + .maps-panel-collapse-tab {
      left: 12px;
      box-shadow: 0 10px 24px rgba(15,23,42,0.12);
    }
    .maps-panel.hidden-by-prop + .maps-panel-collapse-tab {
      opacity: 0;
      pointer-events: none;
    }
    .maps-panel-header {
      margin-top: 0;
      padding:18px 18px 12px;
      border-bottom:none;
    }
    .maps-panel-header h1 {
      font-size:24px;
      line-height:1.1;
      margin:0 0 4px;
    }
    .maps-panel-header p {
      font-size:13px;
      line-height:1.45;
      color:var(--muted);
      margin:0;
      max-width:26ch;
    }
    .maps-panel-section {
      padding:0 18px 18px;
      border-bottom:none;
    }
    .maps-panel-section-title {
      font-size:10px; text-transform:uppercase; letter-spacing:.16em;
      color:#6b7280; margin:0 0 10px; font-weight:700;
    }
    .maps-panel-storm-types {
      display:flex; gap:6px; padding:0 0 10px;
      pointer-events:auto;
    }
    .maps-panel-storm-type-btn {
      flex:1 1 0; min-height:34px; padding:0 10px;
      border:1px solid var(--border); border-radius:10px;
      background:var(--panel-2); color:var(--text); font-size:12px; font-weight:700;
      cursor:pointer; transition:background .15s, border-color .15s, color .15s;
    }
    .maps-panel-storm-type-btn:hover { border-color:var(--accent-2); }
    .maps-panel-storm-type-btn.active {
      background:var(--accent-2); border-color:var(--accent-2); color:var(--text);
    }
    .maps-storm-search-row {
      padding:0 0 10px;
      pointer-events:auto;
    }
    .maps-storm-search-input {
      width:100%; box-sizing:border-box; padding:8px 10px;
      border-radius:8px; border:1px solid var(--border);
      background:var(--panel-2); color:var(--text); font-size:13px;
      font-family:inherit; outline:none;
    }
    .maps-storm-search-input:focus { border-color:var(--accent-2); }
    .maps-storm-search-error {
      min-height:16px; margin-top:6px; font-size:11px; color:var(--muted);
    }
    .maps-storm-search-error.error { color:var(--error); }
    .maps-storm-list {
      list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;
    }
    /* Recent-tab rows as floating cards (HailRecon-style "Recent Hail Events" list) */
    .maps-storm-row {
      display:flex;

      box-shadow:0 20px 36px rgba(15,23,42,0.16);

      background:linear-gradient(180deg, #d8aa4b 0%, #8b5a16 100%);

    .maps-refresh-btn {

      #page-map .maps-side-actions { top:calc(var(--maps-topbar-h) + 98px); right:10px; }

    .hail-band-legend {

      background:var(--panel); border:1px solid var(--border); border-radius:10px;

    .maps-hurricane-ticker-scroll {
      display:inline-block; white-space:nowrap; padding-left:100%;

    .maps-opacity-btn {

    /* â”€â”€ Impact tab: state/city cards (HailRecon-style expandable list) â”€â”€ */
    .maps-impact-state-list { display:flex; flex-direction:column; gap:12px; }
    .maps-impact-state-card {
      background:rgba(255,255,255,0.96);

    /* â”€â”€ Property Modal (centered overlay) â”€â”€ */
    .prop-modal-box {

    .hail-verify-grid { display:flex; flex-direction:column; gap:8px; }

    /* â”€â”€ Mobile Maps Toggle Bar â”€â”€ */
    .maps-mobile-bar {
      display:none;
      z-index:20;
      pointer-events:auto;
    }
    .maps-mobile-bar-btn {
      flex:1; padding:10px 8px; border:none; border-radius:10px;
      font-size:13px; font-weight:600; cursor:pointer; text-align:center;
      background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    }
    .maps-mobile-bar-btn.active {
      background:var(--accent-2); border-color:var(--accent);
    }

      display:none; overflow-y:auto;
      z-index:20;
      pointer-events:auto;
    }
    .maps-mobile-drawer.open {
      display:block;
    }

      .maps-mobile-bar {
        display:flex; gap:8px; padding:8px 12px;
        background:var(--panel); border:1px solid var(--border); flex-shrink:0;
        order:1; position:fixed; left:12px; right:12px; bottom:48px;
        border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.18);
      }
      .maps-mobile-drawer {
        background:var(--panel); border:1px solid var(--border);
        max-height:42vh; flex-shrink:0; order:2;
        position:fixed; left:12px; right:12px; bottom:108px;

      #page-map .maps-opacity-ctrl { right:24px; bottom:112px; }

      /* Bottom panel collapse handle */
      .maps-mobile-bar::before {
        content:''; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
        width:36px; height:4px; border-radius:2px; background:var(--muted); opacity:0.5;
        pointer-events:none;

      /* Collapsed state: hide drawers */
      .maps-mobile-bar.collapsed ~ .maps-mobile-drawer { display:none !important; }
      /* Property panel at bottom on mobile */
      .maps-prop-panel {
        order:3; max-height:50vh;
        top:auto; left:12px; right:12px; bottom:108px; width:auto;
