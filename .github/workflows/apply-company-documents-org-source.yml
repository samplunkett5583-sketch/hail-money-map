name: Apply Company Documents Workspace Source Fix

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - '.github/workflows/apply-company-documents-org-source.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0
      - name: Persist Company Documents upload library
        run: python scripts/apply-company-documents-upload-v2.py
      - name: Persist Company Documents admin authorization
        run: python scripts/apply-company-documents-admin-auth-fix.py
      - name: Persist Company Documents workspace resolver
        run: python scripts/apply-company-documents-org-access.py
      - name: Verify Company Documents navigation
        run: node scripts/verify-company-documents-nav.cjs
      - name: Verify Company Documents workspace resolver
        run: node scripts/verify-company-documents-access.cjs
      - name: Verify clean patch
        run: git diff --check
      - name: Commit permanent source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "Company Documents feature is already permanent in source."
            exit 0
          fi
          git commit -m "Persist Company Documents access in production source"
          git push origin HEAD:pr-43-storm-panel-style
