name: Temporary Maps Opening Publisher

on:
  push:
    branches:
      - codex-trigger-maps-opening-v2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 2

      - name: Apply approved Maps patch and clean up
        env:
          PATCH_B64: |
            
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/maps-opening.patch
          echo 'c267ce92dafac72cd22b3c17feb7a9c19b876b5791def7d0c258f1b8c0b57f76  /tmp/maps-opening.patch' | sha256sum -c -
          git apply --check /tmp/maps-opening.patch
          git apply /tmp/maps-opening.patch
          git checkout HEAD^ -- .github/workflows/mrms-backfill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html .github/workflows/mrms-backfill.yml
          git commit -m 'Fix Maps opening swath and free panning'
          git push origin HEAD:pr-43-storm-panel-style
          git push origin --delete codex-trigger-maps-opening-v2
