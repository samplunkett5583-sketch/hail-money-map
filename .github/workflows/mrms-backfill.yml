name: MRMS Backfill Swaths

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Earliest storm date to process (YYYY-MM-DD)
        required: false
        default: "2025-04-01"
      limit:
        description: Maximum number of storm dates to process
        required: false
        default: "500"

permissions:
  contents: read

jobs:
  backfill:
    name: Run MRMS backfill sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill storm dates
        shell: bash
        run: >-
          node scripts/ingest_mrms_batch.mjs
          --start=${{ inputs.start_date }}
          --limit=${{ inputs.limit }}
