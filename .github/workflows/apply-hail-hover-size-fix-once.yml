name: Apply hail hover size fix once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/apply-hail-hover-size-fix-once.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Apply verified hail hover size fix
        env:
          HAIL_HOVER_PATCH: 
        run: |
          printf '%s' "$HAIL_HOVER_PATCH" | base64 --decode | gzip --decompress > /tmp/hail-hover.patch
          git apply --check /tmp/hail-hover.patch
          git apply /tmp/hail-hover.patch
          grep -q "band300WithSmallerNearbyReport" public/index.html
          grep -q "_canonicalHailDisplayValue" public/index.html
          rm .github/workflows/apply-hail-hover-size-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/apply-hail-hover-size-fix-once.yml
          git commit -m "Keep hail hover sizes aligned with swath bands"
          git push origin HEAD:pr-43-storm-panel-style
