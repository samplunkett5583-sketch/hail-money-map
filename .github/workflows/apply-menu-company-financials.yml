name: Apply approved menu and company financials

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - 'tmp/apply-menu-company-financials.py'
      - '.github/workflows/apply-menu-company-financials.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
      - name: Apply approved patch
        run: python tmp/apply-menu-company-financials.py
      - name: Validate changed file
        run: |
          git diff --check
          grep -q "HM_MENU_COMPANY_FINANCIALS_V1" public/index.html
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');const m=s.match(/<script id=\"hm-menu-company-financials-script-v1\">([\\s\\S]*?)<\\/script>/);if(!m)process.exit(1);new Function(m[1]);"
      - name: Commit only the approved app change
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No app changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --check
          git commit -m "Reorder CRM menu and add company financials"
          git push origin HEAD:pr-43-storm-panel-style
