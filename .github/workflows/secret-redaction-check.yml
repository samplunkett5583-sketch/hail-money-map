name: Secret redaction check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan-tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject committed Supabase service credentials
        run: npm run security:secrets
