name: Restart Corrected MRMS Backfill Once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/restart-corrected-mrms-backfill-once.yml

permissions:
  contents: write
  actions: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Remove one-time dispatcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restart-corrected-mrms-backfill-once.yml
          git commit -m "Remove corrected MRMS backfill dispatcher"
          git push origin HEAD:pr-43-storm-panel-style

      - name: Start corrected six-shard backfill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/mrms-backfill.yml/dispatches \
            -d '{"ref":"pr-43-storm-panel-style","inputs":{"start":"","limit":"100","force":"false"}}'
