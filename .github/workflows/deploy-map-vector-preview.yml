name: Deploy Map Vector Preview

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - 'public/maps3d-engine.js'
      - 'public/index.html'
      - '.github/workflows/deploy-map-vector-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use preview-safe browser key for Maps
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          fb = re.search(r"apiKey:\s*['\"]([^'\"]+)['\"]", s)
          maps = re.search(r"(https://maps\.googleapis\.com/maps/api/js\?key=)([^&'\"]+)", s)
          if not fb or not maps:
              raise SystemExit("Could not locate browser keys")
          s = s[:maps.start(2)] + fb.group(1) + s[maps.end(2):]
          p.write_text(s, encoding="utf-8")
          PY

      - name: Deploy isolated map test preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
          projectId: hailmoneymap
          channelId: map-vector-test
          expires: 7d
