name: Deploy Map Vector Preview

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - 'public/maps3d-engine.js'
      - '.github/workflows/deploy-map-vector-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore server-backed test login
        run: python scripts/apply-legacy-test-login-route.py

      - name: Generate hailmoney.test logins for added users
        run: python scripts/apply-team-hailmoney-test-logins.py

      - name: Deploy isolated map test preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
          projectId: hailmoneymap
          channelId: map-vector-test
          expires: 7d
