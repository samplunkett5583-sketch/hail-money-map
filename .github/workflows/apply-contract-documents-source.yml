name: Apply Contract Documents Source

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - scripts/apply-contract-documents-source.cjs
      - .github/workflows/apply-contract-documents-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Contract Documents to source
        run: node scripts/apply-contract-documents-source.cjs
      - name: Verify Lead Detail contract
        run: node scripts/verify-approved-lead-detail.cjs
      - name: Verify clean patch
        run: git diff --check
      - name: Commit permanent source change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source already contains Contract Documents changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html scripts/verify-approved-lead-detail.cjs
          git commit -m "Add Contract workflow to Lead Documents"
          git push origin HEAD:pr-43-storm-panel-style
