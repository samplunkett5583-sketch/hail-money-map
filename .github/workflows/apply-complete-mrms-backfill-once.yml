name: Apply Complete MRMS Backfill Fix Once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/apply-complete-mrms-backfill-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply-and-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Apply verified MRMS pagination patch
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/mrms-complete.patch
          git apply --check /tmp/mrms-complete.patch
          git apply /tmp/mrms-complete.patch

      - name: Verify patch
        run: |
          git diff --check
          node scripts/verify_mrms_batch_dates.mjs
          node scripts/verify_swath_source_selection.mjs
          /usr/bin/python3 -m py_compile scripts/mrms_mesh_to_geojson.py

      - name: Commit and push code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html scripts/ingest_mrms_batch.mjs scripts/mrms_mesh_to_geojson.py scripts/verify_mrms_batch_dates.mjs
          git commit -m "Backfill every hail date with canonical MRMS swaths"
          git push origin HEAD:pr-43-storm-panel-style

      - name: Remove one-time workflow
        run: |
          git pull --rebase origin pr-43-storm-panel-style
          git rm .github/workflows/apply-complete-mrms-backfill-once.yml
          git commit -m "Remove completed MRMS backfill launcher"
          git push origin HEAD:pr-43-storm-panel-style

      - name: Start six-shard backfill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/${{ github.repository }}/actions/workflows/mrms-backfill.yml/dispatches             -d '{"ref":"pr-43-storm-panel-style","inputs":{"start":"","limit":"100","force":"false"}}'
