name: Publish map gesture fix
on:
  push:
    branches:
      - agent/publish-map-gesture-fix-283ddeb
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0
      - name: Apply verified map gesture repair
        shell: python
        run: |
          from pathlib import Path
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          old = """      function resetMapPointerGesture(suppressClick) {
        if (suppressClick || mapPointerGesture.moved || mapPointerGesture.dragging) {
          mapPointerGesture.suppressClickUntil = Date.now() + 450;
        }
        mapPointerGesture.pointerDown = false;
        mapPointerGesture.dragging = false;
        mapPointerGesture.moved = false;
        mapsState._hailHoverCursorOverSwath = null;
        mapsSetHailHoverCursor(false);
      }
      mapEl.addEventListener('pointerdown', function (event) {
        if (event.button != null && event.button !== 0) return;
        mapPointerGesture.pointerDown = true;"""
          new = """      var mapCursorResetFrame = null;
      function scheduleMapCursorReset() {
        if (mapCursorResetFrame) cancelAnimationFrame(mapCursorResetFrame);
        // Google Maps finishes its internal drag release after the DOM
        // pointerup handler returns. Changing draggableCursor before that
        // release completes interrupts the gesture and can leave the map
        // stuck in its closed-hand state. Wait two paint frames so Google
        // owns the complete pan/zoom gesture from start through release.
        mapCursorResetFrame = requestAnimationFrame(function () {
          mapCursorResetFrame = requestAnimationFrame(function () {
            mapCursorResetFrame = null;
            if (mapPointerGesture.pointerDown || mapPointerGesture.dragging) return;
            mapsState._hailHoverCursorOverSwath = null;
            mapsSetHailHoverCursor(false);
          });
        });
      }
      function resetMapPointerGesture(suppressClick) {
        if (suppressClick || mapPointerGesture.moved || mapPointerGesture.dragging) {
          mapPointerGesture.suppressClickUntil = Date.now() + 450;
        }
        mapPointerGesture.pointerDown = false;
        mapPointerGesture.dragging = false;
        mapPointerGesture.moved = false;
        scheduleMapCursorReset();
      }
      mapEl.addEventListener('pointerdown', function (event) {
        if (event.button != null && event.button !== 0) return;
        if (mapCursorResetFrame) {
          cancelAnimationFrame(mapCursorResetFrame);
          mapCursorResetFrame = null;
        }
        mapPointerGesture.pointerDown = true;"""
          if old not in s:
              if new in s:
                  print("Repair already present")
              else:
                  raise SystemExit("Expected map gesture block not found; refusing to change file")
          else:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
      - name: Verify and publish
        run: |
          git diff --check
          node -e "const fs=require('fs'),s=fs.readFileSync('public/index.html','utf8');const b=[...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());for(const x of b)new Function(x);console.log('JavaScript parsed');"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Fix smooth map drag release"
          git push origin HEAD:pr-43-storm-panel-style
      - name: Remove temporary publisher branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --delete agent/publish-map-gesture-fix-283ddeb || true
