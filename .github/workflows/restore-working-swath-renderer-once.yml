name: Restore working swath renderer once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/restore-working-swath-renderer-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Restore previously working swath renderer
        env:
          RESTORE_SWATH_PATCH: 
        run: |
          printf '%s' "$RESTORE_SWATH_PATCH" | base64 --decode | gzip --decompress > /tmp/restore-swath.patch
          git apply --check /tmp/restore-swath.patch
          git apply /tmp/restore-swath.patch
          grep -q "radar-geometry-report-calibrated" public/index.html
          grep -q "_drawHailCoreRibbons(dateStr, points, rows)" public/index.html
          grep -q "band300WithSmallerNearbyReport" public/index.html
          if grep -q "mrms-canonical" public/index.html; then exit 1; fi
          rm .github/workflows/restore-working-swath-renderer-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/restore-working-swath-renderer-once.yml
          git commit -m "Restore working hail swath renderer"
          git push origin HEAD:pr-43-storm-panel-style
