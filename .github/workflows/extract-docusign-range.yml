name: Extract DocuSign current range

on:
  push:
    branches:
      - docusign-integration

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docusign-integration
          fetch-depth: 0
      - name: Extract exact current DocuSign UI and logic ranges
        shell: python
        run: |
          from pathlib import Path
          lines = Path('public/index.html').read_text(encoding='utf-8').splitlines()
          ranges = [(23045, 23105), (51335, 51765), (51195, 51230)]
          out = []
          for start, end in ranges:
              out.append(f'=== {start}-{end} ===')
              for n in range(start, min(end, len(lines)) + 1):
                  out.append(f'{n}: {lines[n-1]}')
              out.append('')
          Path('DOCUSIGN_CURRENT_RANGES.txt').write_text('\n'.join(out), encoding='utf-8')
      - name: Save extracted ranges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOCUSIGN_CURRENT_RANGES.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record exact current DocuSign workflow range"
          git push origin HEAD:docusign-integration
