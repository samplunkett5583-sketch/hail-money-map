name: Deploy Hail Money Live

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - '.github/workflows/deploy-hail-money-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
          channelId: live
          projectId: hailmoneymap
