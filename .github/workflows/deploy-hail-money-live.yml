name: Deploy Hail Money Live

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - 'public/**'
      - 'functions/**'
      - 'scripts/**'
      - 'firebase.json'
      - '.github/workflows/deploy-hail-money-live.yml'
  workflow_dispatch:

concurrency:
  group: hail-money-live-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply AI estimate pricing fallback
        run: python scripts/apply-ai-estimate-pricing-fallback.py
      - name: Apply AI estimate mobile fair market cleanup
        run: python scripts/apply-ai-estimate-mobile-fair-market-cleanup.py
      - name: Apply AI estimate CRM pipeline cleanup
        run: python scripts/apply-ai-estimate-crm-flow-cleanup.py
      - name: Apply global mobile viewport fit
        run: python scripts/apply-global-mobile-fit.py
      - name: Apply forgot password reset
        run: python scripts/apply-forgot-password.py
      - name: Restore server-backed test login
        run: python scripts/apply-legacy-test-login-route.py
      - name: Generate hailmoney.test logins for added users
        run: python scripts/apply-team-hailmoney-test-logins.py
      - name: Apply Company Documents uploads
        run: python scripts/apply-company-documents-upload-v2.py
      - name: Fix Company Documents admin authorization
        run: python scripts/apply-company-documents-admin-auth-fix.py
      - name: Verify Company Documents navigation
        run: node scripts/verify-company-documents-nav.cjs
      - name: Verify approved Lead Detail contract
        run: node scripts/verify-approved-lead-detail.cjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
          channelId: live
          projectId: hailmoneymap

  deploy-employee-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: hailmoneymap
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore employee company organization claims
        run: python scripts/apply-employee-organization-auth.py
      - name: Allow hail.money in Firebase function CORS
        run: python scripts/apply-functions-cors-custom-domain.py
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Deploy employee authentication functions
        run: |
          gcloud functions deploy employeeTestLogin --gen2 --project=hailmoneymap --region=us-central1 --runtime=nodejs24 --source=functions --entry-point=employeeTestLogin --trigger-http --allow-unauthenticated --impersonate-service-account=hailmoneymap@appspot.gserviceaccount.com --quiet
          gcloud functions deploy provisionEmployee --gen2 --project=hailmoneymap --region=us-central1 --runtime=nodejs24 --source=functions --entry-point=provisionEmployee --trigger-http --allow-unauthenticated --impersonate-service-account=hailmoneymap@appspot.gserviceaccount.com --quiet

  deploy-solar-function:
    needs: deploy-employee-functions
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: hailmoneymap
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Allow hail.money in Firebase function CORS
        run: python scripts/apply-functions-cors-custom-domain.py
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Deploy Solar function through App Engine service account
        id: deploy
        shell: bash
        run: |
          set +e
          gcloud functions deploy getSolarRoofData \
            --gen2 \
            --project=hailmoneymap \
            --region=us-central1 \
            --runtime=nodejs24 \
            --source=functions \
            --entry-point=getSolarRoofData \
            --trigger-http \
            --allow-unauthenticated \
            --impersonate-service-account=hailmoneymap@appspot.gserviceaccount.com \
            --quiet 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-function-deploy-diagnostics
          path: deploy.log
          retention-days: 1
      - name: Fail if deployment failed
        if: ${{ steps.deploy.outputs.exit_code != '0' }}
        run: exit 1
