name: Deploy Hail Money Live

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - 'public/**'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-hail-money-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
          channelId: live
          projectId: hailmoneymap

  deploy-solar-function:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
      - name: Record deploy principal
        shell: python
        run: |
          import json, os
          path = os.environ.get('GOOGLE_APPLICATION_CREDENTIALS') or os.environ.get('GOOGLE_GHA_CREDS_PATH')
          data = json.load(open(path, encoding='utf-8'))
          open('principal.txt', 'w', encoding='utf-8').write(str(data.get('client_email') or 'unknown'))
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g firebase-tools
      - name: Deploy Solar function
        id: deploy
        shell: bash
        run: |
          set +e
          firebase deploy --only functions:getSolarRoofData --project hailmoneymap --non-interactive 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-function-deploy-diagnostics
          path: |
            deploy.log
            principal.txt
          retention-days: 1
      - name: Fail if deployment failed
        if: ${{ steps.deploy.outputs.exit_code != '0' }}
        run: exit 1
