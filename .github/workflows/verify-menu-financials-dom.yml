name: Verify menu and Company Financials DOM

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - '.github/workflows/verify-menu-financials-dom.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
      - name: Fix Admin and Owner role lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          bad="typeof crmGetRole === 'function' ? crmGetrole() : ''"
          good="typeof crmGetRole === 'function' ? crmGetRole() : ''"
          if s.count(bad) != 1:
              raise SystemExit('Expected exactly one incorrect role lookup, found '+str(s.count(bad)))
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
      - name: Validate exact shipped script syntax
        run: |
          git diff --check
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');const m=s.match(/<script id=\"hm-menu-company-financials-script-v1\">([\\s\\S]*?)<\\/script>/);if(!m)process.exit(1);new Function(m[1]);"
      - name: Build browser harnesses from the exact shipped script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          src = Path('public/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="hm-menu-company-financials-script-v1">([\s\S]*?)</script>', src)
          if not m:
              raise SystemExit('Company Financials script not found')
          app = m.group(1)
          menu = '''<nav class="sidebar"><div class="logo">HM</div><button class="nav-item"><span class="nav-label">Dashboard</span></button><div class="nav-dropdown-group nav-dropdown-group-new"><span class="nav-label">New</span></div><button class="nav-item" data-dashboard-action="start-inspection"><span class="nav-label">Start</span></button><button class="nav-item" data-dashboard-action="roofer-ai"><span class="nav-label">AI</span></button><button class="nav-item" data-dashboard-action="pipeline"><span class="nav-label">Pipeline</span></button><button class="nav-item" data-dashboard-action="leads"><span class="nav-label">Leads</span></button><button class="nav-item" data-dashboard-action="photos"><span class="nav-label">Photos</span></button><button class="nav-item" data-dashboard-action="map"><span class="nav-label">Maps</span></button><button class="nav-item" data-dashboard-action="estimates"><span class="nav-label">Estimates</span></button><button class="nav-item" data-dashboard-action="calendar"><span class="nav-label">Calendar</span></button><button class="nav-item" data-dashboard-action="meetings"><span class="nav-label">Meetings</span></button><button class="nav-item" data-dashboard-action="production"><span class="nav-label">Production</span></button><button class="nav-item" data-dashboard-action="tester-training"><span class="nav-label">Training</span></button><button class="nav-item nav-item-admin-only" data-dashboard-action="employee"><span class="nav-label">Employee</span></button><button class="nav-item nav-item-admin-only" data-dashboard-action="settings"><span class="nav-label">Settings</span></button><button class="nav-item"><span class="nav-label">Contacts</span></button></nav>'''
          def make(role, name, switch=None):
              switch_js = ''
              if switch:
                  switch_js = f"setTimeout(function(){{TEST_ROLE={json.dumps(switch)};document.body.appendChild(document.createElement('i'));}},250);"
              collect_delay = 650 if switch else 450
              html = f'''<!doctype html><html><head><meta charset="utf-8"></head><body><section id="page-main-menu" class="page"><div class="hm-dashboard-ref">{menu}</div></section><script>var TEST_ROLE={json.dumps(role)};var LAST_PAGE='';function crmGetRole(){{return TEST_ROLE;}}function crmGetTeamMembers(){{return [{{id:'office1',name:'Office One',role:'Office',active:true}},{{id:'rep1',name:'Rep One',role:'Sales Rep',active:true}}];}}function crmGetPayrollItems(){{return [];}}function crmGetLeads(){{return [];}}function crmSavePayrollItems(){{return true;}}function crmGetPayrollWeekRange(){{return {{start:'2026-09-14',end:'2026-09-20'}};}}function crmFormatMoney(v){{return '$'+Number(v||0).toFixed(2);}}function crmFormatPercentValue(v){{return (Number(v||0)*100).toFixed(1)+'%';}}function crmEscapeHtml(v){{return String(v);}}function showPage(id){{LAST_PAGE=id;document.querySelectorAll('.page').forEach(function(p){{p.classList.toggle('active',p.id===id);}});}}</script><script>{app}</script><script>{switch_js}setTimeout(function(){{var nav=document.querySelector('nav.sidebar');var visible=Array.from(nav.children).filter(function(n){{return getComputedStyle(n).display!=='none';}}).map(function(n){{var l=n.querySelector('.nav-label');return l?l.textContent.trim():'';}}).filter(Boolean);var fin=document.querySelector('[data-dashboard-action="company-financials"]');if(fin&&{json.dumps(switch is None)})fin.click();var result={{role:TEST_ROLE,menu:visible,financialPage:!!document.getElementById('page-company-financials'),lastPage:LAST_PAGE,officeRows:document.querySelectorAll('#company-financials-employees tr').length}};document.body.setAttribute('data-test-result',encodeURIComponent(JSON.stringify(result)));}}, {collect_delay});</script></body></html>'''
              Path('/tmp/'+name+'.html').write_text(html,encoding='utf-8')
          make('Admin','admin')
          make('Owner','owner')
          make('Manager','manager')
          make('Sales Rep','rep')
          make('Admin','admin-to-rep','Sales Rep')
          PY
      - name: Run Chromium DOM verification
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          for name in admin owner manager rep admin-to-rep; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=1400 --dump-dom "file:///tmp/$name.html" > "/tmp/$name.out.html"
          done
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse, json, html
          expected_admin=['New','Start','AI','Pipeline','Leads',"Photo's",'Maps','Estimates','Calendar','Meetings','Production','Company Financials','Training','Employees','Settings']
          expected_user=['New','Start','AI','Pipeline','Leads',"Photo's",'Maps','Estimates','Calendar','Meetings','Production','Training']
          def result(name):
              s=Path('/tmp/'+name+'.out.html').read_text(encoding='utf-8')
              m=re.search(r'data-test-result="([^"]+)"',s)
              if not m: raise AssertionError(name+' did not publish a test result')
              return json.loads(urllib.parse.unquote(html.unescape(m.group(1))))
          a=result('admin'); o=result('owner'); m=result('manager'); r=result('rep'); x=result('admin-to-rep')
          for privileged in (a,o):
              assert privileged['menu']==expected_admin, privileged
              assert privileged['financialPage'] is True and privileged['lastPage']=='page-company-financials', privileged
              assert privileged['officeRows']==1, privileged
          assert m['menu']==expected_user and m['financialPage'] is False, m
          assert r['menu']==expected_user and r['financialPage'] is False, r
          assert x['menu']==expected_user and x['financialPage'] is False, x
          print('Admin DOM:', a)
          print('Owner DOM:', o)
          print('Manager DOM:', m)
          print('Sales Rep DOM:', r)
          print('Admin -> Rep DOM:', x)
          print('All menu and Company Financials DOM checks passed.')
          PY
      - name: Commit the verified role fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --check
          git commit -m "Fix Admin and Owner Company Financials access"
          git push origin HEAD:pr-43-storm-panel-style
