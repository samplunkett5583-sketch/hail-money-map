name: Inspect document editor hooks

on:
  push:
    branches:
      - docusign-integration

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docusign-integration
          fetch-depth: 0
      - name: Extract current document upload and template editor logic
        shell: python
        run: |
          from pathlib import Path
          lines = Path('public/index.html').read_text(encoding='utf-8').splitlines()
          needles = [
            'page-company-doc', 'Company Documents', 'savedFormTemplates', 'tpl-builder',
            'template-builder', 'upload-template', 'document-upload', 'company-doc',
            'form-template', 'template upload', 'PDF template', 'Add Field', 'field palette'
          ]
          hits = []
          for i, line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                  hits.append(i)
          windows=[]
          for i in hits:
              lo=max(0,i-20); hi=min(len(lines),i+45)
              if windows and lo <= windows[-1][1]+10:
                  windows[-1]=(windows[-1][0],max(windows[-1][1],hi))
              else:
                  windows.append((lo,hi))
          out=[]
          for lo,hi in windows:
              out.append(f'=== lines {lo+1}-{hi} ===')
              for j in range(lo,hi): out.append(f'{j+1}: {lines[j]}')
              out.append('')
          Path('DOCUMENT_EDITOR_INSPECTION.txt').write_text('\n'.join(out) if out else 'No matches.\n', encoding='utf-8')
      - name: Save inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOCUMENT_EDITOR_INSPECTION.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current document editor hooks"
          git push origin HEAD:docusign-integration
