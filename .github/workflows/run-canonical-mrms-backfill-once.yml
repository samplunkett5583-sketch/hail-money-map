name: Run canonical MRMS backfill once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/run-canonical-mrms-backfill-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/run-canonical-mrms-backfill-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/run-canonical-mrms-backfill-once.yml
          git commit -m "Remove completed MRMS backfill launcher"
          git push origin HEAD:pr-43-storm-panel-style

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install MRMS contour tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy
          /usr/bin/python3 -c "from osgeo import gdal, ogr; import numpy; assert hasattr(ogr, 'GT_Flatten')"

      - name: Replace all generated storm swaths
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QGIS_PYTHON: /usr/bin/python3
        run: node scripts/ingest_mrms_batch.mjs --force
