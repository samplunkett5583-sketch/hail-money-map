name: Apply map options fix once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/apply-map-options-fix-once.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Apply verified map options fix
        env:
          MAP_OPTIONS_PATCH: 
        run: |
          printf '%s' "$MAP_OPTIONS_PATCH" | base64 --decode | gzip --decompress > /tmp/map-options.patch
          git apply --check /tmp/map-options.patch
          git apply /tmp/map-options.patch
          grep -q "Show Wind Spotter Reports" public/index.html
          grep -q "Address Markers" public/index.html
          rm .github/workflows/apply-map-options-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/apply-map-options-fix-once.yml
          git commit -m "Fix map options and add wind spotter reports"
          git push origin HEAD:pr-43-storm-panel-style
