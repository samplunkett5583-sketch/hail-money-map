name: Apply verified first-login password setup
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-employee-password-setup.yml
      - scripts/force-employee-password-setup.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped source changes and syntax checks
        run: node scripts/force-employee-password-setup.cjs
      - name: Commit verified changes
        run: |
          git diff --check
          if git diff --quiet -- public/index.html functions/index.js; then
            echo "No app changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html functions/index.js
          git commit -m "Enforce Firebase password setup at first employee login"
          git push origin HEAD:master
