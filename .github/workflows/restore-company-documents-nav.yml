name: Restore Company Documents Nav

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - '.github/one-time/restore-company-documents-nav.cjs'
      - '.github/workflows/restore-company-documents-nav.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore Company Documents in every CRM sidebar
        run: node .github/one-time/restore-company-documents-nav.cjs
      - name: Verify Company Documents navigation
        run: node scripts/verify-company-documents-nav.cjs
      - name: Verify clean patch
        run: git diff --check
      - name: Commit permanent source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html scripts/verify-company-documents-nav.cjs
          if git diff --cached --quiet; then
            echo "Company Documents navigation already repaired."
            exit 0
          fi
          git commit -m "Restore Company Documents to CRM navigation"
          git push origin HEAD:pr-43-storm-panel-style
