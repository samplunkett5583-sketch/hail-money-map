name: Add Company Financials dollar icon

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - '.github/workflows/add-company-financials-dollar-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
      - name: Add dollar sign icon above Company Financials
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old = "    btn.innerHTML = '<span class=\"dash-icon\" data-dash-icon=\"file-dollar\" aria-hidden=\"true\"></span><span class=\"nav-label\">Company Financials</span>';"
          new = "    btn.innerHTML = '<span class=\"dash-icon hm-company-financials-dollar\" aria-hidden=\"true\" style=\"display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;line-height:1;\">$</span><span class=\"nav-label\">Company Financials</span>';"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Company Financials icon line, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate only intended icon change
        run: |
          git diff --check
          grep -q 'hm-company-financials-dollar' public/index.html
          grep -q '>\$</span><span class="nav-label">Company Financials</span>' public/index.html
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');const m=s.match(/<script id=\"hm-menu-company-financials-script-v1\">([\s\S]*?)<\/script>/);if(!m)process.exit(1);new Function(m[1]);console.log('Company Financials script syntax OK');"
      - name: Commit icon, remove helper, and advance approved lock
        run: |
          rm .github/workflows/add-company-financials-dollar-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/add-company-financials-dollar-icon.yml
          git diff --cached --check
          git commit -m "Add dollar icon to Company Financials"
          git push origin HEAD:pr-43-storm-panel-style
          git push --force origin HEAD:APPROVED_FULL_APP_LOCK_2026-09-19
