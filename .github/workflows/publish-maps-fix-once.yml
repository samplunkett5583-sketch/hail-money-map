name: Publish approved Maps fix once
on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/publish-maps-fix-once.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 2
      - name: Verify launcher parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "f333fa13aa092efb8d8dbe614b20313bd0aadcdd"
      - name: Apply approved Maps patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/maps-fix.patch
          git apply --check /tmp/maps-fix.patch
          git apply /tmp/maps-fix.patch
      - name: Commit fix and remove launcher
        shell: bash
        run: |
          rm .github/workflows/publish-maps-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/publish-maps-fix-once.yml
          git commit -m "Fix Maps dragging zoom and storm framing"
          git push origin HEAD:pr-43-storm-panel-style
