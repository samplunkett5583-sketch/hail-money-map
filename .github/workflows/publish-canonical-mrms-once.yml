name: Publish canonical MRMS fix and backfill once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/publish-canonical-mrms-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-and-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Apply and publish canonical MRMS code
        env:
          MRMS_FIX_PATCH: 
        run: |
          printf '%s' "$MRMS_FIX_PATCH" | base64 --decode | gzip --decompress > /tmp/mrms-system-fix.patch
          git apply --check /tmp/mrms-system-fix.patch
          git apply /tmp/mrms-system-fix.patch
          git restore .github/workflows/mrms-backfill.yml .github/workflows/nexrad_tracks_ingest.yml
          git diff --check
          node --check scripts/ingest_mrms_batch.mjs
          node --check scripts/ingest_mrms_swaths.mjs
          node scripts/ingest_mrms_swaths.mjs --self-test
          node scripts/verify_swath_source_selection.mjs
          /usr/bin/python3 -m py_compile scripts/mrms_mesh_to_geojson.py
          rm .github/workflows/publish-canonical-mrms-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html scripts/ingest_mrms_batch.mjs scripts/ingest_mrms_swaths.mjs scripts/mrms_mesh_to_geojson.py scripts/verify_swath_source_selection.mjs .github/workflows/publish-canonical-mrms-once.yml
          git commit -m "Replace synthetic hail swaths with canonical MRMS contours"
          git push origin HEAD:pr-43-storm-panel-style

      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install MRMS contour tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy
          /usr/bin/python3 -c "from osgeo import gdal, ogr; import numpy"

      - name: Replace all generated storm swaths
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QGIS_PYTHON: /usr/bin/python3
        run: node scripts/ingest_mrms_batch.mjs --force
