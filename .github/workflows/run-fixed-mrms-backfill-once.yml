name: Run Fixed MRMS Backfill Once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/run-fixed-mrms-backfill-once.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install GDAL grid tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy
          /usr/bin/python3 -c "from osgeo import gdal, ogr; import numpy"

      - name: Regenerate unfinished storm-date swaths
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QGIS_PYTHON: /usr/bin/python3
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "6"
        run: |
          node scripts/verify_mrms_batch_dates.mjs
          node scripts/ingest_mrms_batch.mjs             "--limit=100"             "--shard-index=$SHARD_INDEX"             "--shard-count=$SHARD_COUNT"

  cleanup:
    if: ${{ always() }}
    needs: backfill
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
      - name: Remove one-time launcher
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/run-fixed-mrms-backfill-once.yml
          git commit -m "Remove fixed MRMS backfill launcher"
          git push origin HEAD:pr-43-storm-panel-style
