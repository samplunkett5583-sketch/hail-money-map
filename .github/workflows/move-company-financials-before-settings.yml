name: Move Company Financials before Settings

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - '.github/workflows/move-company-financials-before-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
      - name: Move Company Financials immediately before Settings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old = "    Array.prototype.slice.call(document.querySelectorAll('.hm-dashboard-ref nav.sidebar, nav.sidebar')).forEach(normalizeSidebar);"
          new = "    Array.prototype.slice.call(document.querySelectorAll('.hm-dashboard-ref nav.sidebar, nav.sidebar')).forEach(function (sidebar) {\n      normalizeSidebar(sidebar);\n      if (isAdminOwner()) {\n        var financials = sidebar.querySelector(':scope > .hm-company-financials-nav');\n        var settings = sidebar.querySelector(':scope > [data-dashboard-action=\"settings\"]');\n        if (financials && settings && financials.nextElementSibling !== settings) sidebar.insertBefore(financials, settings);\n      }\n    });"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one sidebar normalization line, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate intended menu change
        run: |
          git diff --check
          grep -q "sidebar.insertBefore(financials, settings)" public/index.html
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');const m=s.match(/<script id=\"hm-menu-company-financials-script-v1\">([\s\S]*?)<\/script>/);if(!m)process.exit(1);new Function(m[1]);console.log('Company Financials script syntax OK');"
      - name: Commit app change and remove one-use helper
        run: |
          rm .github/workflows/move-company-financials-before-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/move-company-financials-before-settings.yml
          git diff --cached --check
          git commit -m "Move Company Financials before Settings"
          git push origin HEAD:pr-43-storm-panel-style
