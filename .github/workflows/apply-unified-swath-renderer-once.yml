name: Apply unified swath renderer once

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/apply-unified-swath-renderer-once.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0

      - name: Apply verified unified swath renderer fix
        env:
          UNIFIED_SWATH_PATCH: 
        run: |
          printf '%s' "$UNIFIED_SWATH_PATCH" | base64 --decode | gzip --decompress > /tmp/unified-swath.patch
          git apply --check /tmp/unified-swath.patch
          git apply /tmp/unified-swath.patch
          grep -q "mrms-canonical" public/index.html
          grep -q "_drawReviewedHailDisplayTracks(dateStr)" public/index.html
          if grep -q "_drawHailCoreRibbons(dateStr, points, rows)" public/index.html; then exit 1; fi
          rm .github/workflows/apply-unified-swath-renderer-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/apply-unified-swath-renderer-once.yml
          git commit -m "Unify hail swath rendering styles"
          git push origin HEAD:pr-43-storm-panel-style
