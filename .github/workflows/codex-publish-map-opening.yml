name: Publish approved Maps opening fix

on:
  workflow_dispatch:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - .github/workflows/codex-publish-map-opening.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-43-storm-panel-style
          fetch-depth: 0
      - name: Apply approved Maps patch
        shell: bash
        run: |
          git apply <<'PATCH'
          diff --git a/public/index.html b/public/index.html
          index 378714a..d27b32b 100644
          --- a/public/index.html
          +++ b/public/index.html
          @@ -25682,6 +25682,7 @@
                hailShadowReviewRowsByDate: {},
                /* source-tracking: populated by _fetchLsr90DayDates */
                dateHasPolygon: {},          // dateStr -> true if storm_polygons has a row
          +      dateHasCanonicalHailSwath: {}, // dateStr -> true when an authoritative radar/reviewed hail footprint exists
                dateHasHailReports: {},      // dateStr -> true if hail_lsr_raw has a row
                dateHasWindReports: {},      // dateStr -> true if storm_lsr_raw has a row
                debugSourceCounts: {         // diagnostic counts from last fetch
          @@ -27334,8 +27335,11 @@
                      mapsMeasureSyncPhase('maps-ensure-visible-map', mapsEnsureVisibleMap);
                      mapsMarkNavigationTiming('initialization-finish');
                      mapsFetchRecentDates().then(function () {
          +              return mapsWaitForStormRankingSummaries(
          +                (mapsState.stormDates || []).slice(0, MAPS_STORM_DATE_BATCH_SIZE)
          +              );
          +            }).then(function () {
                        mapsPreviewMostRecentStormOnOpen();
          -              _fetchStormRankingSummaries((mapsState.stormDates || []).slice(0, MAPS_STORM_DATE_BATCH_SIZE));
                        mapsMarkNavigationTiming('background-date-refresh-completed');
                      }).catch(function () {
                        mapsMarkNavigationTiming('background-date-refresh-completed');
          @@ -27348,9 +27352,22 @@
           
              function mapsPreviewMostRecentStormOnOpen() {
                var page = document.getElementById('page-map');
          -      var mostRecentDate = mapsState.stormDates && mapsState.stormDates[0];
          +      var stormDates = mapsState.stormDates || [];
          +      var mostRecentDate = stormDates.find(function (dateStr) {
          +        return mapsState.dateHasCanonicalHailSwath &&
          +          mapsState.dateHasCanonicalHailSwath[dateStr] === true;
          +      }) || stormDates.find(function (dateStr) {
          +        return mapsState.dateHasPolygon && mapsState.dateHasPolygon[dateStr] === true;
          +      }) || stormDates[0];
                if (!page || !page.classList.contains('active') || !mapsState.map || !mostRecentDate) return false;
          -      mapsPreviewDate(mostRecentDate);
          +      // Re-run the normal loader if the card was selected before its geometry
          +      // summary finished loading. mapsDrawDate safely deduplicates an in-flight
          +      // request and restores/refits an already cached swath.
          +      if (mapsState.previewDate === mostRecentDate) {
          +        mapsDrawDate(mostRecentDate);
          +      } else {
          +        mapsPreviewDate(mostRecentDate);
          +      }
                return true;
              }
           
          @@ -27473,7 +27490,11 @@
                  mapsMeasureSyncPhase('ticker-initialization', initHurricaneTicker);
                  mapsState.ready = true;
                  renderStormPanelActionButtons(document.getElementById('maps-storm-actions'));
          -        mapsPreviewMostRecentStormOnOpen();
          +        var newestKnownDate = mapsState.stormDates && mapsState.stormDates[0];
          +        if (newestKnownDate && mapsState.stormRankingLoadedDates &&
          +            mapsState.stormRankingLoadedDates[newestKnownDate]) {
          +          mapsPreviewMostRecentStormOnOpen();
          +        }
                  // Load rankings only for the first visible card batch. Older dates
                  // are enriched lazily as the user scrolls.
                  _fetchStormRankingSummaries((mapsState.stormDates || []).slice(0, MAPS_STORM_DATE_BATCH_SIZE));
          @@ -27682,6 +27703,7 @@
                      summary.severeHailReportCount = 0;
                      summary.hail = null;
                      polygonSummaries[dateStr] = null;
          +            mapsState.dateHasCanonicalHailSwath[dateStr] = false;
                    });
                    hailRows.forEach(function (row) {
                      var dateStr = String(row && row.event_date || '').slice(0, 10);
          @@ -27717,6 +27739,11 @@
                      poly.max = Math.max(Number(poly.max) || hailValue, hailValue);
                      poly.swathCount = (Number(poly.swathCount) || 0) + 1;
                      mapsState.dateHasPolygon[dateStr] = true;
          +            var source = String(row.source || '').toLowerCase();
          +            if (source === 'mrms_mesh' || source === 'mrms' ||
          +                source === 'manual' || source === 'hailtrace') {
          +              mapsState.dateHasCanonicalHailSwath[dateStr] = true;
          +            }
                    });
                    mapsApplyValidatedHousingRows(dates, polygonRows, impactRows);
                    return mapsEstimateHousingFromStormPolygons(dates, polygonRows, hailRows).then(function () {
          @@ -27740,6 +27767,28 @@
                  });
              }
           
          +    function mapsWaitForStormRankingSummaries(dateList) {
          +      var dates = (dateList || []).map(mapsNormalizeDate).filter(Boolean);
          +      return _fetchStormRankingSummaries(dates).then(function () {
          +        return new Promise(function (resolve) {
          +          var checks = 0;
          +          function finishWhenSettled() {
          +            var stillLoading = dates.some(function (dateStr) {
          +              return mapsState.stormRankingPendingDates &&
          +                mapsState.stormRankingPendingDates[dateStr] === true;
          +            });
          +            if (!stillLoading || checks >= 200) {
          +              resolve();
          +              return;
          +            }
          +            checks++;
          +            setTimeout(finishWhenSettled, 50);
          +          }
          +          finishWhenSettled();
          +        });
          +      });
          +    }
          +
              // ── Paginated fetch of event_date values from a single Supabase table ──
              // Reads only the columns needed to build the Most Recent Storms date list and
              // walks every page until the raw source is exhausted.
          @@ -28617,8 +28666,7 @@ function mapsGoogleReady() {
                if (!map || map._hailMoneyMinimumZoomGuardInstalled) return;
                map._hailMoneyMinimumZoomGuardInstalled = true;
                map.setOptions({
          -        minZoom: MAPS_MIN_ZOOM,
          -        restriction: { latLngBounds: MAPS_US_BOUNDS, strictBounds: false }
          +        minZoom: MAPS_MIN_ZOOM
                });
                mapsClampMinimumZoom(map);
              }
          @@ -28648,7 +28696,6 @@ function mapsGoogleReady() {
                    center: MAPS_DEFAULT_CENTER,
                    zoom: MAPS_DEFAULT_ZOOM,
                    minZoom: MAPS_MIN_ZOOM,
          -          restriction: { latLngBounds: MAPS_US_BOUNDS, strictBounds: false },
                    isFractionalZoomEnabled: true,
                    mapTypeId: google.maps.MapTypeId.ROADMAP,
                    styles: [],
          PATCH
      - name: Validate patch
        run: git diff --check
      - name: Commit approved change and remove launcher
        shell: bash
        run: |
          rm .github/workflows/codex-publish-map-opening.yml
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add public/index.html .github/workflows/codex-publish-map-opening.yml
          git commit -m "Fix Maps opening swath and free panning"
          git push origin HEAD:pr-43-storm-panel-style
