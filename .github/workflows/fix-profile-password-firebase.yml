name: Apply scoped Firebase profile password fix
on:
  push:
    branches:
      - fix/profile-password-firebase-20261006
    paths:
      - .github/workflows/fix-profile-password-firebase.yml
      - scripts/fix-profile-password-firebase.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only profile password UI and verify syntax
        run: |
          node scripts/fix-profile-password-firebase.cjs
          git diff --check
      - name: Commit isolated fix
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No app changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Make profile password changes persist in Firebase Auth"
          git push origin HEAD:fix/profile-password-firebase-20261006
