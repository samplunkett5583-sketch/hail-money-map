name: Canonical MRMS Hail Swaths

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Specific SPC storm dates (comma-separated YYYY-MM-DD)"
        required: false
        type: string
      force:
        description: "Replace existing canonical MRMS polygons"
        required: true
        default: true
        type: boolean
  schedule:
    # The prior SPC day is complete at 12Z. Allow two hours for the archive.
    - cron: "0 14 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install GDAL grid tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy
          /usr/bin/python3 -c "from osgeo import gdal, ogr; import numpy"

      - name: Build canonical hail swaths
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QGIS_PYTHON: /usr/bin/python3
          REQUESTED_DATES: ${{ inputs.dates }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          if [ -n "$REQUESTED_DATES" ]; then
            IFS=',' read -ra DATES <<< "$REQUESTED_DATES"
          else
            DATES=("$(date -u -d 'yesterday' +%F)")
          fi
          for STORM_DATE in "${DATES[@]}"; do
            STORM_DATE="$(echo "$STORM_DATE" | xargs)"
            ARGS=("--date=$STORM_DATE")
            if [ "$FORCE_REBUILD" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
              ARGS+=("--force")
            fi
            node scripts/ingest_mrms_swaths.mjs "${ARGS[@]}"
          done
