name: Verify Storm Impact Counts

on:
  push:
    branches:
      - pr-43-storm-panel-style
    paths:
      - ".github/workflows/storm-impact-counts.yml"
      - "scripts/verify_storm_impact_counts.mjs"
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Dates to verify
        required: true
        default: recent
        type: choice
        options:
          - recent
          - all
          - date
      date:
        description: Exact date for date scope (YYYY-MM-DD)
        required: false
        type: string
      limit:
        description: Max dates for all scope
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: storm-impact-counts
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify recent storm impact counts
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'recent')
        run: node scripts/verify_storm_impact_counts.mjs --days=14 --limit=40 --unverified=false

      - name: Advance historical impact-count backlog
        if: github.event_name == 'schedule'
        run: node scripts/verify_storm_impact_counts.mjs --unverified=true --limit=60

      - name: Verify one storm date
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'date'
        run: node scripts/verify_storm_impact_counts.mjs --date="${{ inputs.date }}" --force=true

      - name: Backfill all unchecked storm dates
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all'
        run: node scripts/verify_storm_impact_counts.mjs --unverified=true --limit="${{ inputs.limit }}"
