name: Setup DocuSign Base Secrets

on:
  push:
    branches:
      - docusign-integration
    paths:
      - '.github/workflows/setup-docusign-base-secrets.yml'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAILMONEYMAP }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: hailmoneymap
      - name: Set DocuSign client ID
        shell: bash
        run: |
          set -euo pipefail
          if gcloud secrets describe DOCUSIGN_CLIENT_ID --project=hailmoneymap >/dev/null 2>&1; then
            printf %s '2537248f-ecd8-453e-a807-2aa2283a3956' | gcloud secrets versions add DOCUSIGN_CLIENT_ID --project=hailmoneymap --data-file=- >/dev/null
          else
            printf %s '2537248f-ecd8-453e-a807-2aa2283a3956' | gcloud secrets create DOCUSIGN_CLIENT_ID --project=hailmoneymap --replication-policy=automatic --data-file=- >/dev/null
          fi
      - name: Create DocuSign token encryption key
        shell: bash
        run: |
          set -euo pipefail
          if gcloud secrets describe DOCUSIGN_TOKEN_KEY --project=hailmoneymap >/dev/null 2>&1; then
            echo 'DOCUSIGN_TOKEN_KEY already exists; leaving the existing encryption key unchanged.'
          else
            openssl rand -base64 32 | tr -d '\n' | gcloud secrets create DOCUSIGN_TOKEN_KEY --project=hailmoneymap --replication-policy=automatic --data-file=- >/dev/null
            echo 'DOCUSIGN_TOKEN_KEY created.'
          fi
      - name: Verify secret metadata only
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe DOCUSIGN_CLIENT_ID --project=hailmoneymap --format='value(name)'
          gcloud secrets describe DOCUSIGN_TOKEN_KEY --project=hailmoneymap --format='value(name)'
