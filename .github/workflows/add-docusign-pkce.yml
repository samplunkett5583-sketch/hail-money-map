name: Add DocuSign PKCE

on:
  push:
    branches:
      - docusign-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docusign-integration
          fetch-depth: 0
      - name: Add PKCE to DocuSign OAuth
        shell: python
        run: |
          from pathlib import Path
          p = Path('functions/docusign.js')
          s = p.read_text(encoding='utf-8')

          old = """function oauthRedirectUri() {\n  return `https://${REGION}-${projectId()}.cloudfunctions.net/docusignOAuthCallback`;\n}\n"""
          new = old + """\nfunction createPkceVerifier() {\n  return crypto.randomBytes(64).toString('base64url');\n}\n\nfunction createPkceChallenge(verifier) {\n  return crypto.createHash('sha256').update(String(verifier)).digest().toString('base64url');\n}\n"""
          if 'function createPkceVerifier()' not in s:
              if old not in s: raise SystemExit('oauthRedirectUri marker not found')
              s = s.replace(old, new, 1)

          old = """async function exchangeCode(code) {\n  const basic = Buffer.from(`${DOCUSIGN_CLIENT_ID.value()}:${DOCUSIGN_CLIENT_SECRET.value()}`).toString('base64');\n  return requestJson(`${authBase()}/oauth/token`, {\n    method: 'POST',\n    headers: { Authorization: `Basic ${basic}`, 'Content-Type': 'application/x-www-form-urlencoded' },\n    body: new URLSearchParams({ grant_type: 'authorization_code', code: String(code) }).toString()\n  });\n}\n"""
          new = """async function exchangeCode(code, codeVerifier) {\n  const verifier = String(codeVerifier || '').trim();\n  if (!verifier) throw Object.assign(new Error('DocuSign PKCE verifier is missing. Start the connection again.'), { statusCode: 400 });\n  const basic = Buffer.from(`${DOCUSIGN_CLIENT_ID.value()}:${DOCUSIGN_CLIENT_SECRET.value()}`).toString('base64');\n  return requestJson(`${authBase()}/oauth/token`, {\n    method: 'POST',\n    headers: { Authorization: `Basic ${basic}`, 'Content-Type': 'application/x-www-form-urlencoded' },\n    body: new URLSearchParams({\n      grant_type: 'authorization_code',\n      code: String(code),\n      redirect_uri: oauthRedirectUri(),\n      code_verifier: verifier\n    }).toString()\n  });\n}\n"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'async function exchangeCode(code, codeVerifier)' not in s:
              raise SystemExit('exchangeCode marker not found')

          old = """    const state = crypto.randomBytes(24).toString('hex');\n    const returnUrl = safeReturnUrl(req.body && req.body.returnUrl, 'https://www.hail.money/');\n    await db.collection(OAUTH_STATES).doc(state).set({\n      organizationId,\n      uid: user.uid,\n      returnUrl,\n      environment: environmentName(),\n"""
          new = """    const state = crypto.randomBytes(24).toString('hex');\n    const codeVerifier = createPkceVerifier();\n    const codeChallenge = createPkceChallenge(codeVerifier);\n    const returnUrl = safeReturnUrl(req.body && req.body.returnUrl, 'https://www.hail.money/');\n    await db.collection(OAUTH_STATES).doc(state).set({\n      organizationId,\n      uid: user.uid,\n      returnUrl,\n      codeVerifier,\n      environment: environmentName(),\n"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const codeVerifier = createPkceVerifier();' not in s:
              raise SystemExit('OAuth state marker not found')

          old = """      client_id: DOCUSIGN_CLIENT_ID.value(),\n      redirect_uri: oauthRedirectUri(),\n      state\n"""
          new = """      client_id: DOCUSIGN_CLIENT_ID.value(),\n      redirect_uri: oauthRedirectUri(),\n      code_challenge: codeChallenge,\n      code_challenge_method: 'S256',\n      state\n"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "code_challenge_method: 'S256'" not in s:
              raise SystemExit('OAuth params marker not found')

          old = '    const tokenResponse = await exchangeCode(code);'
          new = """    const codeVerifier = String(stateData.codeVerifier || '').trim();\n    if (!codeVerifier) throw Object.assign(new Error('DocuSign PKCE verifier is missing or expired. Start the connection again.'), { statusCode: 400 });\n    const tokenResponse = await exchangeCode(code, codeVerifier);"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'exchangeCode(code, codeVerifier)' not in s:
              raise SystemExit('OAuth callback exchange marker not found')

          p.write_text(s, encoding='utf-8')
      - name: Validate PKCE integration
        run: |
          node --check functions/docusign.js
          git diff --check
          grep -F "code_challenge_method: 'S256'" functions/docusign.js
          grep -F "code_verifier: verifier" functions/docusign.js
      - name: Commit PKCE support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/docusign.js
          if git diff --cached --quiet; then
            echo "PKCE already configured."
            exit 0
          fi
          git commit -m "Add PKCE to DocuSign OAuth"
          git push origin HEAD:docusign-integration
